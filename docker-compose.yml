volumes:
    mysql-data:
services:
    app:
        build: .
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www
    mysql:
        image: mysql:8.0.25
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: revision
        ports:
            - "3307:3306"
        volumes:
            - mysql-data:/var/lib/mysql
    redis:
        image: redis:latest
        ports:
            - "6379:6379"
